<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gelap Solid Hanya Di Dalam Bulatan -->
    <radialGradient id="solidInnerBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="50%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Latar Belakang DALAM Bulatan (Solid Gelap) -->
  <circle cx="250" cy="250" r="235" fill="url(#solidInnerBg)" stroke="#F59E0B" stroke-width="3" opacity="1"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Penutup Perfume / Crown di Bahagian Atas -->
  <path d="M232 85 L250 70 L268 85 L260 98 L240 98 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <rect x="246" y="98" width="8" height="12" fill="url(#goldGrad)"/>

  <!-- Monogram Huruf 'K' -->
  <path d="M 175 145 L 210 145 C 225 145, 230 155, 230 170 L 230 205 L 205 230 L 175 230 Z" fill="url(#goldGrad)"/>
  <path d="M 175 145 L 200 145 L 200 230 L 175 230 Z" fill="url(#goldGrad)"/>

  <path d="M 215 195 L 290 130 C 305 118, 325 128, 315 148 L 285 195 Z" fill="url(#silverGrad)" filter="url(#glow)"/>
  <path d="M 200 205 L 275 275 C 290 290, 315 280, 305 260 L 260 205 Z" fill="url(#goldGrad)"/>
  <circle cx="240" cy="200" r="6" fill="#FDE68A" filter="url(#glow)"/>

  <!-- Teks Jenama -->
  <text x="250" y="335" font-family="'Arial', sans-serif" font-size="32" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="7">KIENON</text>
  <text x="250" y="362" font-family="'Arial', sans-serif" font-size="12" font-weight="700" fill="#9CA3AF" text-anchor="middle" letter-spacing="9">PERFUMES</text>

  <!-- Garisan Hiasan Bawah -->
  <path d="M 170 395 Q 250 403 330 395" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="250" cy="397" r="2.5" fill="#F59E0B"/>
</svg>
